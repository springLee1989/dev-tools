name: Test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm ci

      - name: Typecheck / build frontend
        run: npm run build

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Validate example profiles
        run: |
          cargo run --manifest-path src-tauri/Cargo.toml --bin devicesim-cli -- validate examples/mqtt-temperature-sensor.json
          cargo run --manifest-path src-tauri/Cargo.toml --bin devicesim-cli -- validate examples/mixed-gateway.json
          cargo run --manifest-path src-tauri/Cargo.toml --bin devicesim-cli -- validate examples/modbus-tcp-slave.json
          cargo run --manifest-path src-tauri/Cargo.toml --bin devicesim-cli -- validate examples/modbus-tcp-client.json
          cargo run --manifest-path src-tauri/Cargo.toml --bin devicesim-cli -- validate examples/mqtt-multi-devices.json
